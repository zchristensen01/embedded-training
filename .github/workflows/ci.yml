name: ci

on:
  push:
  pull_request:

# What CI can and cannot check here.
#
# practice/katas/*/src/ is gitignored on purpose — the implementation is deleted
# before every rep, so it is never committed and CI can never link a kata binary.
# What CI does check is that the artifacts that ARE permanent stay valid: every
# frozen header parses, every frozen test suite compiles against it, and the
# practice log is well formed. `make test` still runs, and is a no-op unless you
# happen to have an implementation in the working tree.

jobs:
  frozen:
    # GCC and Clang disagree about what is worth warning about, and the union of
    # the two catches more than either alone.
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make check-frozen (${{ matrix.cc }})
        run: make check-frozen CC=${{ matrix.cc }}

  frozen-py:
    # The Python counterpart of `frozen`. src/ is gitignored so nothing can be run, but a
    # frozen suite that does not import or collects no tests is broken, and used to ship
    # green because no job here ever touched Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install pytest
        run: python3 -m pip install --quiet pytest
      - name: frozen Python suites import and collect
        run: make check-frozen-py

  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate logs/log.tsv
        run: make check-log
      - name: schedule, build plan and timer blocks agree
        run: make check-calendar
      - name: spec and coverage map describe the same capabilities
        run: make check-coverage
      - name: every deck tag names a real capability
        run: make check-decks
      - name: generated files match their generators
        run: make check-generated

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: tools import and parse cleanly
        run: |
          python3 -m compileall -q tools/
          python3 tools/schedule.py > /dev/null
          python3 tools/report.py
